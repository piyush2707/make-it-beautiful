<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">The Make It Beautiful workflow</title><desc id="desc">Four steps: inspect, prioritize, implement, and verify.</desc>
  <rect width="1200" height="230" rx="18" fill="#0c1424"/>
  <g font-family="Arial,sans-serif">
    <g transform="translate(34 35)"><rect width="250" height="160" rx="15" fill="#131f35" stroke="#334155"/><circle cx="36" cy="38" r="18" fill="#233b66"/><text x="36" y="44" fill="#93c5fd" font-size="16" text-anchor="middle" font-weight="700">1</text><text x="25" y="82" fill="#f8fafc" font-size="22" font-weight="700">Inspect</text><text x="25" y="110" fill="#aab8ce" font-size="14">Understand the UI</text><text x="25" y="131" fill="#aab8ce" font-size="14">and its constraints.</text></g>
    <path d="M291 115 H319 M311 107 L320 115 L311 123" stroke="#6478ff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(329 35)"><rect width="250" height="160" rx="15" fill="#131f35" stroke="#334155"/><circle cx="36" cy="38" r="18" fill="#332b63"/><text x="36" y="44" fill="#c4b5fd" font-size="16" text-anchor="middle" font-weight="700">2</text><text x="25" y="82" fill="#f8fafc" font-size="22" font-weight="700">Prioritize</text><text x="25" y="110" fill="#aab8ce" font-size="14">Pick changes with</text><text x="25" y="131" fill="#aab8ce" font-size="14">the highest impact.</text></g>
    <path d="M586 115 H614 M606 107 L615 115 L606 123" stroke="#6478ff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(624 35)"><rect width="250" height="160" rx="15" fill="#131f35" stroke="#334155"/><circle cx="36" cy="38" r="18" fill="#153e48"/><text x="36" y="44" fill="#6ee7b7" font-size="16" text-anchor="middle" font-weight="700">3</text><text x="25" y="82" fill="#f8fafc" font-size="22" font-weight="700">Implement</text><text x="25" y="110" fill="#aab8ce" font-size="14">Make cohesive,</text><text x="25" y="131" fill="#aab8ce" font-size="14">purposeful changes.</text></g>
    <path d="M881 115 H909 M901 107 L910 115 L901 123" stroke="#6478ff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(919 35)"><rect width="247" height="160" rx="15" fill="#131f35" stroke="#334155"/><circle cx="36" cy="38" r="18" fill="#4b321f"/><text x="36" y="44" fill="#fcd34d" font-size="16" text-anchor="middle" font-weight="700">4</text><text x="25" y="82" fill="#f8fafc" font-size="22" font-weight="700">Verify</text><text x="25" y="110" fill="#aab8ce" font-size="14">Check the diff and</text><text x="25" y="131" fill="#aab8ce" font-size="14">available test results.</text></g>
  </g>
</svg>
